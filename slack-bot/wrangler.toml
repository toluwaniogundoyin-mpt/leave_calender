name = "leave-calender-slack-bots"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Plain (non-secret) config. Set with `wrangler deploy` or in the dashboard.
[vars]
GITHUB_OWNER = "toluwaniogundoyin-mpt"
GITHUB_REPO = "leave-calender"
GITHUB_BRANCH = "main"
LEAVES_PATH = "data/leaves.yaml"

[observability.logs]
enabled = true
invocation_logs = true

# Secrets (set via `wrangler secret put <NAME>`, never committed):
#   SLACK_SIGNING_SECRET  — from the Slack app's Basic Information page
#   GITHUB_TOKEN          — fine-grained PAT, Contents: Read/write, scoped to this one repo
